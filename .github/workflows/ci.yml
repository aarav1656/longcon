name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install binaryen 123
        run: |
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          echo "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  /tmp/binaryen.tgz" | sha256sum -c -
          sudo tar xzf /tmp/binaryen.tgz -C /opt
          echo "/opt/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: docs check
        run: scripts/check-docs.sh
      - name: client tests
        run: |
          (cd worker && bun install --frozen-lockfile && bun test ./test)
          (cd web && bun install --frozen-lockfile && bun test ./test)
      - name: layout check
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "no root Cargo.toml. Add a workspace manifest so CI can build every contract."
            exit 1
          fi
      - name: build wasm
        run: |
          scripts/build-wasm.sh target/wasm
      - name: test
        run: |
          cargo test --workspace --no-fail-fast
