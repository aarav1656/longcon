name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version
      - name: layout check
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "no root Cargo.toml. Add a workspace manifest so CI can build every contract."
            exit 1
          fi
      - name: build wasm
        run: |
          scripts/build-wasm.sh target/wasm
      - name: test
        run: |
          cargo test --workspace --no-fail-fast
