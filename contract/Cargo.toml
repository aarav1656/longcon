[package]
name = "longcon"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
proptest = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }

